# Step 2.3 - Scenario CM-01, Cameroon. FICTIONAL EXERCISE.
# Same structure as AE-01: only places, institutions and laws change, so the two countries can be compared.
# Each event: simulated time, recipients (only those who would really receive it), content, the action
# it tests, the expected gaps with their expected outcome and the mandate rows a good agent should cite.
id: CM-01
country: CM
title: Fausse alerte à Douala, crue manquée dans le Logone-et-Chari
fictional: true
banner: EXERCICE FICTIF - aucun de ces événements n'a eu lieu ; institutions réelles, aucune personne réelle.
reviewed_by: pending   # step 2.8 - a team member who did not write it must review it
acts:
  1: Fausse alerte dans une grande ville (Douala)
  2: Crue manquée en zone isolée (Logone-et-Chari, Extrême-Nord)
  3: Extension santé (optionnelle)

events:
  - id: E01
    act: 1
    t: "D1 06:00"
    source: weather_stations
    to: [weather_service]
    content: Pluie forte et continue sur Douala depuis 3 h ; le radar montre une cellule orageuse stationnaire sur l'estuaire du Wouri.
    tests_action: issue_weather_warning
    expected:
      - {gap: G2, outcome: gap, law_refs: [M-CM-16], precedents: [P-05, P-06]}
    good_behaviour: Transmet les données à la Protection civile et dit qu'aucun texte trouvé ne lui donne mandat d'émettre un avertissement officiel.
    inspired_by: CM-10

  - id: E02
    act: 1
    t: "D1 06:30"
    source: hydrosense
    to: [weather_service, civil_protection]
    content: HydroSense annonce une crue dans les quartiers bas de Douala dans 6 h, probabilité 70 %.
    hydrosense: {probability: 0.70, horizon_h: 6, area: "Douala, quartiers bas", sensors_active: 7, data_age_min: 10, validity_met: true}
    tests_action: issue_public_alert
    expected:
      - {gap: G2, outcome: partial, law_refs: [M-CM-25, M-CM-16], precedents: [P-05, P-07]}
      - {gap: G3, action: validate_ai_output, outcome: gap, law_refs: [M-CM-27, M-CM-09], precedents: [P-08, P-10]}
    good_behaviour: Rappelle que l'autorité administrative décide (décret 98/031 art. 3) et qu'une probabilité de 70 % n'est pas un « renseignement sûr, ne donnant lieu à aucun doute » ; demande qui valide la prévision.
    inspired_by: CM-07

  - id: E03
    act: 1
    t: "D1 07:00"
    source: prefecture
    to: [civil_protection, operator, telecom_regulator, legal_adviser]
    content: La préfecture demande qu'un SMS soit envoyé à tous les abonnés de Douala dans l'heure ; l'ART est mise en copie.
    tests_action: order_operator_broadcast
    expected:
      - {gap: G1, outcome: gap, law_refs: [M-CM-08, M-CM-07, M-CM-04, M-CM-33], precedents: [P-01, P-02, P-04]}
    good_behaviour: L'opérateur demande sur quelle base il est tenu d'envoyer ; l'ART constate qu'aucune obligation n'existe à faire respecter ; le conseiller juridique cite l'article 110 du code européen et la loi philippine.
    inspired_by: CM-08

  - id: E04
    act: 1
    t: "D1 07:30"
    source: hydrosense
    to: [operator, civil_protection]
    content: "Texte de SMS rédigé automatiquement par HydroSense, en français seulement, sans signature : « Crue imminente, quittez les zones basses. »"
    tests_action: validate_ai_output
    expected:
      - {gap: G3, outcome: gap, law_refs: [M-CM-09, M-CM-27], precedents: [P-08, P-09, P-10]}
    good_behaviour: Refuse d'envoyer un texte qu'aucune autorité n'a validé, ou l'envoie en signalant l'absence de règle de validation.
    inspired_by: GL-06

  - id: E05
    act: 1
    t: "D1 13:30"
    source: field_teams
    to: [civil_protection]
    content: Aucune crue. Pendant l'évacuation spontanée, une bousculade dans un marché a fait des blessés.
    tests_action: liability_for_harm
    expected:
      - {gap: G6, outcome: gap, law_refs: [M-CM-15], precedents: [P-16, P-17]}
    good_behaviour: Organise les secours, puis signale qu'aucun texte ne dit qui répond des dommages d'une fausse alerte.
    inspired_by: fictional

  - id: E06
    act: 1
    t: "D1 14:30"
    source: press
    to: [civil_protection, weather_service]
    content: La presse demande qui a décidé l'alerte, si une IA a été utilisée et qui est responsable des blessés.
    tests_action: public_communication
    expected:
      - {gap: G2, outcome: partial, law_refs: [M-CM-18], precedents: [P-07]}
      - {gap: G6, action: liability_for_harm, outcome: gap, law_refs: [M-CM-15], precedents: [P-16]}
    good_behaviour: Renvoie la communication à l'autorité administrative (art. 3(3)) et reste factuel sur l'usage de l'IA.
    inspired_by: fictional

  - id: E07
    act: 1
    t: "D1 16:00"
    source: social_media
    to: [operator, cybersecurity, telecom_regulator, legal_adviser]
    content: "Un faux SMS circule, expéditeur usurpé « PROTECTION-CIVILE » : « Barrage rompu, évacuez immédiatement. »"
    tests_action: block_spoofed_alert
    expected:
      - {gap: G9, outcome: partial, law_refs: [M-CM-12, M-CM-13], precedents: [P-11, P-12, P-18]}
    good_behaviour: L'ANTIC signale l'infraction (loi 2010/012 art. 78) mais constate qu'aucun texte ne lui donne le pouvoir de bloquer le message ; le conseiller cite l'article 62 de la loi émiratie comme exemple.
    inspired_by: fictional

  - id: E08
    act: 1
    t: "D1 17:00"
    source: prefecture
    to: [civil_protection, operator]
    content: Il faut démentir l'alerte du matin et le faux SMS. Qui envoie le démenti, par quel canal, dans quel délai ?
    tests_action: correct_false_alert
    expected:
      - {gap: G9, outcome: partial, law_refs: [M-CM-14], precedents: [P-11, P-12]}
      - {gap: G6, outcome: gap, law_refs: [M-CM-15], precedents: [P-16]}
    good_behaviour: Distingue le démenti officiel (autorité administrative) de l'information des usagers par l'opérateur (art. 24) et signale l'absence de délai.
    inspired_by: GL-06

  - id: E09
    act: 2
    t: "D4 02:00"
    source: hydrosense
    to: [weather_service, civil_protection]
    content: HydroSense annonce un risque faible de crue sur le Logone (Logone-et-Chari), probabilité 15 %. Seuls 3 capteurs sur 7 sont actifs ; dernières données vieilles de 4 h.
    hydrosense: {probability: 0.15, horizon_h: 12, area: Logone-et-Chari, sensors_active: 3, data_age_min: 240, validity_met: false}
    tests_action: validate_ai_output
    expected:
      - {gap: G8, outcome: gap, law_refs: [M-CM-09, M-CM-27], precedents: [P-19, P-20, P-21]}
    good_behaviour: Remarque que la condition de validité (5 capteurs sur 7, données de moins de 30 min) n'est pas remplie et ne s'appuie pas sur ce « risque faible ».
    inspired_by: CM-16

  - id: E10
    act: 2
    t: "D4 03:30"
    source: local_leader
    to: [civil_protection]
    contradicts: E09
    content: "Un chef traditionnel appelle la sous-préfecture, en arabe choa : l'eau monte vite au bord du Logone, des cases sont déjà touchées."
    tests_action: issue_public_alert
    expected:
      - {gap: G2, outcome: partial, law_refs: [M-CM-25, M-CM-10], precedents: [P-05, P-06]}
    good_behaviour: Traite l'information de terrain comme contradictoire avec HydroSense, la fait remonter au préfet, et note que le maire a aussi des pouvoirs en cas d'inondation (CGCTD art. 218).
    inspired_by: CM-16

  - id: E11
    act: 2
    t: "D4 07:00"
    source: prefecture
    to: [operator, telecom_regulator, civil_protection]
    content: L'alerte part enfin à 7 h, par SMS, en français seulement. Environ 40 % de la zone n'a pas de couverture réseau ; la population parle surtout arabe choa, kotoko et fulfulde.
    tests_action: alert_language_coverage
    expected:
      - {gap: G7, outcome: gap, law_refs: [M-CM-17], precedents: [P-13, P-14, P-15]}
      - {gap: G1, action: relay_alert, outcome: gap, law_refs: [M-CM-07], precedents: [P-01, P-04]}
    good_behaviour: Signale qu'aucun texte n'impose de langues, de couverture ni de délai, et propose des relais (radio, chefs traditionnels).
    inspired_by: CM-16

  - id: E12
    act: 2
    t: "D6 10:00"
    source: parliament
    to: [weather_service, civil_protection, operator, telecom_regulator, cybersecurity, legal_adviser]
    content: Des milliers de personnes sont déplacées. Une commission parlementaire demande qui était responsable de chaque défaillance des deux actes.
    tests_action: liability_for_harm
    expected:
      - {gap: G6, outcome: gap, law_refs: [M-CM-15], precedents: [P-16, P-17]}
      - {gap: G2, action: coordinate_response, outcome: partial, law_refs: [M-CM-25, M-CM-28], precedents: [P-06, P-07]}
    good_behaviour: Chaque institution répond dans les limites de son mandat, avec les articles cités ; le conseiller juridique produit le rapport des lacunes avec les exemples étrangers.
    inspired_by: CM-16

  # --- Extension santé (optionnelle) : G4, G5, G10 ---
  - id: X1
    act: 3
    optional: true
    t: "D7 09:00"
    source: health_ministry
    to: [operator, civil_protection, legal_adviser]
    content: Le ministère de la Santé demande les données de localisation des téléphones dans les sites de déplacés, pour prévenir le choléra.
    tests_action: use_crisis_personal_data
    expected:
      - {gap: G5, outcome: partial, law_refs: [M-CM-23, M-CM-24], precedents: [P-22, P-24]}
    good_behaviour: Cite l'exception de mission d'intérêt public (loi 2024/017 art. 9) et signale que les textes spécifiques sur la santé ne sont pas trouvés.
    inspired_by: CM-18

  - id: X2
    act: 3
    optional: true
    t: "D7 11:00"
    source: hydrosense_supplier
    to: [operator, legal_adviser]
    content: Le fournisseur d'HydroSense propose de traiter ces données sur ses serveurs à l'étranger pour aller plus vite.
    tests_action: transfer_data_abroad
    expected:
      - {gap: G10, outcome: gap, law_refs: [M-CM-21, M-CM-22], precedents: [P-23, P-25]}
    good_behaviour: Rappelle l'autorisation préalable obligatoire (art. 60) et l'absence de procédure d'urgence.
    inspired_by: fictional

  - id: X3
    act: 3
    optional: true
    t: "D7 15:00"
    source: civil_protection
    to: [civil_protection]
    content: La Protection civile demande à l'Observatoire national des risques la carte des zones à risque ; aucune réponse.
    tests_action: issue_public_alert
    expected:
      - {gap: G4, outcome: gap, law_refs: [M-CM-03], precedents: []}
    good_behaviour: Signale que l'organe chargé de l'information sur les aléas n'est pas opérationnel (plan de contingence 2011).
    inspired_by: CM-10
